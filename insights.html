<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Attention — Insights</title>
        <link href="dashboard.css" rel="stylesheet" type="text/css" />
        <link href="insights.css" rel="stylesheet" type="text/css" />
        <script type="module" src="insights.js"></script>
    </head>
    <body>
        <header>
            <a class="brand" href="videos.html" title="Go to bookmarked videos">
                <img class="logo" src="assets/ext-icon.png" alt="" />
                <span>Attention</span>
            </a>
            <a id="insights-link" class="header-link active" aria-current="page" href="insights.html" title="Insights">
                <span class="icon" aria-hidden="true"></span>
                <span>Insights</span>
            </a>
            <a id="settings-link" class="header-link" href="settings.html" title="Settings">
                <span class="icon" aria-hidden="true"></span>
                <span>Settings</span>
            </a>
        </header>

        <main class="wide">
            <section class="panel insights-panel">
                <div class="insights-top">
                    <h1>Insights</h1>
                    <!-- insights.js marks the active range -->
                    <div class="range-switch" role="group" aria-label="Period">
                        <button type="button" class="range-btn" data-days="7">7 days</button>
                        <button type="button" class="range-btn" data-days="30">30 days</button>
                        <button type="button" class="range-btn" data-days="90">90 days</button>
                    </div>
                </div>

                <!-- insights.js renders everything below -->
                <p id="insights-note" class="section-note" hidden></p>
                <div id="stat-cards" class="stat-cards"></div>

                <div class="insights-grid">
                    <section class="insights-section" aria-labelledby="screen-time-title">
                        <h2 id="screen-time-title">Screen time per day</h2>
                        <div id="screen-time-chart"></div>
                    </section>

                    <section class="insights-section" aria-labelledby="shorts-reels-title">
                        <h2 id="shorts-reels-title">Shorts &amp; Reels blocked per day</h2>
                        <div id="shorts-reels-chart"></div>
                        <div class="chart-legend">
                            <span class="legend-swatch legend-shorts" aria-hidden="true"></span><span>Shorts</span>
                            <span class="legend-swatch legend-reels" aria-hidden="true"></span><span>Reels</span>
                        </div>
                    </section>

                    <section class="insights-section" aria-labelledby="top-sites-title">
                        <h2 id="top-sites-title">Top blocked sites</h2>
                        <div id="top-sites-chart"></div>
                    </section>

                    <section class="insights-section" aria-labelledby="heatmap-title">
                        <h2 id="heatmap-title">Screen time calendar</h2>
                        <p class="section-note">The last 13 weeks, darker is more time on watched sites.</p>
                        <div id="heatmap-chart"></div>
                    </section>
                </div>
            </section>
        </main>
    </body>
</html>
