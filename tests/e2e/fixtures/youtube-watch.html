<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Big Buck Bunny - YouTube</title></head>
<body>
    <div id="player">
        <video class="video-stream" width="320" height="180"></video>
        <div class="ytp-chrome-bottom">
            <div class="ytp-left-controls"></div>
        </div>
    </div>
    <div id="owner">
        <div id="channel-name"><a href="/@blender">Blender Foundation</a></div>
    </div>
    <div id="secondary">
        <ytd-reel-shelf-renderer class="shorts-shelf">Shorts shelf (should be removed)</ytd-reel-shelf-renderer>
        <ytd-compact-video-renderer class="video">Related video</ytd-compact-video-renderer>
        <ytd-rich-section-renderer id="rich-on-watch">Rich section on the watch page (hidden, not removed)</ytd-rich-section-renderer>
    </div>
</body>
</html>
