<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Attention — Site blocked</title>
        <link href="dashboard.css" rel="stylesheet" type="text/css" />
        <link href="blocked.css" rel="stylesheet" type="text/css" />
        <script type="module" src="blocked.js"></script>
    </head>
    <body>
        <header>
            <a class="brand" href="videos.html" title="Go to bookmarked videos">
                <img class="logo" src="assets/ext-icon.png" alt="" />
                <span>Attention</span>
            </a>
            <a id="insights-link" class="header-link" href="insights.html" title="Insights">
                <span class="icon" aria-hidden="true"></span>
                <span>Insights</span>
            </a>
            <a id="settings-link" class="header-link" href="settings.html" title="Settings">
                <span class="icon" aria-hidden="true"></span>
                <span>Settings</span>
            </a>
        </header>

        <main class="blocked-main">
            <!-- blocked.js fills this in from the ?site= query parameter and the settings -->
            <section id="blocked" class="blocked-card" aria-live="polite"></section>
        </main>
    </body>
</html>
